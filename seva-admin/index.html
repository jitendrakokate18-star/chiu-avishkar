<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SEVA Health Admin</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><img src="logo.jpg" alt="SEVA Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: inherit; background-color: white;"></div>
        <h1 class="auth-title">Welcome to SEVA Health</h1>
        <p class="auth-subtitle">Sign in to the Admin Portal</p>
      </div>

      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="admin@sevahealth.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group flex justify-between items-center mb-6">
          <label class="flex items-center gap-2 text-sm text-secondary">
            <input type="checkbox" checked>
            Remember me
          </label>
          <a href="#" class="text-sm font-medium">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full p-3 font-semibold text-base">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
